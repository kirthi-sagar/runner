name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly pulse: keep the build signal fresh on a quiet tree.
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  cloud-verify:
    name: Production CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (ARM); it gates portability
        # (fmt/clippy/build) plus the live Darwin syscall tests, while
        # the full hermetic suite stays Linux-only.
        os: [ubuntu-22.04, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format verification
        run: cargo fmt --all -- --check

      - name: Linting & static analysis
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Supply chain audit
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install --locked cargo-deny
          cargo deny check

      - name: Run automated test suite
        if: runner.os == 'Linux'
        run: cargo test --workspace --all-features

      - name: Documentation check
        if: runner.os == 'Linux'
        run: cargo doc --workspace --no-deps

      - name: Build all targets (macOS link check)
        if: runner.os == 'macOS'
        run: cargo build --workspace --all-targets

      - name: Darwin syscall tests (macOS live)
        if: runner.os == 'macOS'
        run: cargo test -p runner-core --lib governor::darwin
