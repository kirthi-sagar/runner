name: Dogfood (manual self-hosted validation)

# Isolated manual workflow: never triggered by push or pull_request.
# Dispatch from the Actions tab when self-hosted validation is needed.
on:
  workflow_dispatch:

jobs:
  dogfood-verify:
    name: Dogfooding Runner (self-hosted zero-freeze)
    runs-on: [self-hosted, runner]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Sandbox Isolation & cgroup
        run: |
          echo "=== Executing inside runner zero-freeze sandbox ==="
          cat /proc/self/cgroup || true

      - name: Ensure cargo is in PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Run automated test suite
        run: cargo test --workspace --all-targets

      - name: Run clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings
