[workspace]
resolver = "2"
members = [".", "crates/*"]

[workspace.package]
version = "1.7.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "io-std", "fs", "process", "signal", "sync"] }
clap = { version = "4", features = ["derive", "env"] }
nix = { version = "0.31", features = ["sched", "mount", "user", "signal", "process"] }
boringtun = "0"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.23"
mdns-sd = "0"
rand = "0.8"
tar = "0.4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", default-features = false, features = ["tokio", "json", "query", "http1"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
futures-util = { version = "0.3", default-features = false }
bytes = "1"
jsonwebtoken = "9"
libc = "0.2"
runner-core = { path = "crates/runner-core", version = "1.7.2" }
runner-sandbox = { path = "crates/runner-sandbox", version = "1.7.2" }
runner-providers = { path = "crates/runner-providers", version = "1.7.2" }
runner-telemetry = { path = "crates/runner-telemetry", version = "1.7.2" }
runner-enterprise = { path = "crates/runner-enterprise", version = "1.7.2" }
runner-cli = { path = "crates/runner-cli", version = "1.7.2" }
runner-guest-agent = { path = "crates/runner-guest-agent", version = "1.7.2" }

[package]
name = "runner"
version.workspace = true
edition.workspace = true
description = "Zero-freeze, AI-agent-native local and federated CI runner mesh (open-core facade)"
license.workspace = true

[lib]
name = "runner"
path = "src/lib.rs"

[dependencies]
runner-core.workspace = true
runner-sandbox.workspace = true
runner-providers.workspace = true
runner-telemetry.workspace = true
runner-enterprise.workspace = true
runner-cli.workspace = true
runner-guest-agent.workspace = true

[dev-dependencies]
tokio.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde_json.workspace = true
reqwest.workspace = true
base64.workspace = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
