[package]
name = "runner-cli"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Unified runner binary entrypoint and service management"

[[bin]]
name = "runner"
path = "src/main.rs"
# The bin documents no API (see the `runner` facade lib); skipping it
# also silences the bin/lib `runner/index.html` filename collision.
doc = false

[dependencies]
clap.workspace = true
tokio.workspace = true
async-trait.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
runner-core.workspace = true
runner-sandbox.workspace = true
runner-providers.workspace = true
runner-enterprise.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
