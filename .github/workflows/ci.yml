name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly pulse: keep the build signal fresh on a quiet tree.
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  cloud-verify:
    name: Production CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (ARM); it gates portability
        # (fmt/clippy/build) plus the live Darwin syscall tests, while
        # the full hermetic suite stays Linux-only.
        os: [ubuntu-22.04, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format verification
        run: cargo fmt --all -- --check

      - name: Linting & static analysis
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Supply chain audit
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install --locked cargo-deny
          cargo deny check

      - name: Run automated test suite
        if: runner.os == 'Linux'
        run: cargo test --workspace --all-features

      - name: Documentation check
        if: runner.os == 'Linux'
        run: cargo doc --workspace --no-deps

      - name: Build all targets (macOS link check)
        if: runner.os == 'macOS'
        run: cargo build --workspace --all-targets

      - name: Darwin syscall tests (macOS live)
        if: runner.os == 'macOS'
        run: cargo test -p runner-core --lib governor::darwin

  wsl2-smoke:
    name: WSL2 smoke (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Force LF checkouts (WSL scripts break on CRLF)
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ubuntu distro (WSL2)
        shell: pwsh
        run: |
          wsl --set-default-version 2
          wsl --install -d Ubuntu --no-launch
          wsl -d Ubuntu -u root echo "distro ready"

      - name: Enable systemd in Ubuntu distro
        shell: pwsh
        run: |
          wsl -d Ubuntu -u root bash -c "printf '[boot]\nsystemd=true\n' > /etc/wsl.conf"
          wsl --shutdown
          wsl -d Ubuntu -u root test -d /run/systemd/system

      - name: Refuse /mnt checkout (negative preflight test)
        shell: pwsh
        run: |
          $wslPath = '/mnt/' + $env:GITHUB_WORKSPACE.Substring(0,1).ToLower() + $env:GITHUB_WORKSPACE.Substring(2).Replace('\','/')
          $out = wsl -d Ubuntu -u root bash -c "cd '$wslPath' && ./install.sh --dry-run" 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -or $out -notmatch '/mnt/c') {
            Write-Error "expected install.sh to refuse the /mnt checkout, got exit=$LASTEXITCODE out=$out"
            exit 1
          }
          exit 0 # expected refusal observed; do not propagate wsl's nonzero exit

      - name: Install Rust toolchain in distro
        shell: pwsh
        run: |
          wsl -d Ubuntu -u root bash -c "apt-get update -qq && apt-get install -y -qq curl ca-certificates build-essential cmake"
          wsl -d Ubuntu -u root bash -c "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal"

      - name: Install inside the distro
        shell: pwsh
        run: |
          $wslPath = '/mnt/' + $env:GITHUB_WORKSPACE.Substring(0,1).ToLower() + $env:GITHUB_WORKSPACE.Substring(2).Replace('\','/')
          wsl -d Ubuntu -u root bash -c "export PATH=/root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin && rm -rf /root/runner && cp -r '$wslPath' /root/runner && cd /root/runner && chmod +x ./install.sh && ./install.sh"

      - name: Assert doctor wsl check passes
        shell: pwsh
        run: |
          wsl -d Ubuntu -u root bash -c '/usr/local/bin/runner doctor --format json | python3 -c "import json,sys; d=json.load(sys.stdin); checks={c[\"name\"]:c[\"status\"] for c in d[\"checks\"]}; assert checks.get(\"wsl\")==\"pass\", checks"'

      - name: Tier-3 dispatch smoke (governed job from /root)
        shell: pwsh
        run: |
          $out = wsl -d Ubuntu -u root bash -c "cd /root && /usr/local/bin/runner exec echo wsl-smoke-ok" 2>&1 | Out-String
          if ($out -notmatch 'wsl-smoke-ok') {
            Write-Error "Tier-3 exec failed: $out"
            exit 1
          }
          exit 0

  windows-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW cross-toolchain
        run: sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-gnu
      - name: Build (cross-compile, --locked)
        run: cargo build --release --target x86_64-pc-windows-gnu --locked -p runner-cli
      - name: Clippy (Windows target)
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: runner-windows-x86_64
          path: target/x86_64-pc-windows-gnu/release/runner.exe
