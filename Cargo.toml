[package]
name = "runner"
version = "0.3.0"
edition = "2021"
description = "Host supervisor, federated mesh coordinator, and sandbox hypervisor for GitHub Actions runners"
license = "MIT"

[lib]
name = "runner"
path = "src/lib.rs"

[[bin]]
name = "runner"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
nix = { version = "0.29", features = ["sched", "mount", "user", "signal", "process"] }
boringtun = "0"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
mdns-sd = "0"
rand = "0.8"
tar = "0.4"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", default-features = false, features = ["tokio", "json", "query", "http1"] }
tower = "0.5"
jsonwebtoken = "9"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
