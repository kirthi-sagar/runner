name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x64
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            arch: arm64
            os: macos-latest
          - target: x86_64-pc-windows-gnu
            arch: x64
            os: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install MinGW cross-toolchain
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target ${{ matrix.target }} -p runner-cli

      - name: Smoke-test release binary (native)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/runner"
          "$BIN" --version
          "$BIN" doctor --format json | python3 -c "import json,sys; assert json.load(sys.stdin)['ok'] is True, 'doctor not ok'"

      - name: Verify cross-compiled artifact arch
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          # Cannot execute aarch64 on the x64 runner: assert arch instead.
          file "target/${{ matrix.target }}/release/runner" | grep -q aarch64

      - name: Verify Windows artifact format
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          # Cannot execute Windows on the Linux runner: assert PE32+.
          file "target/${{ matrix.target }}/release/runner.exe" | grep -qi "PE32"

      - name: Smoke-test release binary (macOS native)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/runner"
          "$BIN" --version
          # No doctor-ok assertion: Linux-only checks fail on macOS by
          # design (see docs/macos.md); arch + version prove the build.
          file "$BIN" | grep -q arm64

      - name: Package archive with checksums
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ]; then
            # Flat exe + sidecar (install.ps1 downloads these directly).
            cp "target/${{ matrix.target }}/release/runner.exe" runner-windows-x86_64.exe
            sha256sum runner-windows-x86_64.exe > runner-windows-x86_64.exe.sha256
            exit 0
          fi
          STAGE="runner-${{ github.ref_name }}-${{ matrix.target }}"
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            STAGE="runner-darwin-arm64"
          fi
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/runner" "$STAGE/runner"
          cp README.md LICENSE "$STAGE/"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"
          else
            shasum -a 256 "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            runner-*.tar.gz
            runner-*.tar.gz.sha256
            runner-windows-x86_64.exe
            runner-windows-x86_64.exe.sha256

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            runner-*.tar.gz
            runner-*.tar.gz.sha256
            runner-windows-x86_64.exe
            runner-windows-x86_64.exe.sha256
          generate_release_notes: true
